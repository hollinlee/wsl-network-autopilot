name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: |
          sh -n bin/wsl-network
          sh -n install.sh
          sh -n uninstall.sh
          sh -n tests/test.sh
      - name: Run behavior tests
        run: ./tests/test.sh
      - name: Verify systemd units
        run: systemd-analyze --user verify systemd/*.service systemd/*.timer

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
